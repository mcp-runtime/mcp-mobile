name: Release SDKs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/check_release.py "$RELEASE_TAG"
      - run: mvn -B -ntp verify
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdk-assets
          path: target/release/*
          if-no-files-found: error
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: swift test --jobs 4
      - run: swift run --jobs 4 MCPMobileCheck
      - name: Compile the iOS library
        run: >-
          swift build --target MCPMobile --jobs 4
          --triple arm64-apple-ios16.0-simulator
          --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          --scratch-path .build-ios
  publish:
    needs: [kotlin, swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: release-sdk-assets
          path: release-assets
      - name: Publish checked preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists; refusing to replace published artifacts."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --prerelease \
            --title "$RELEASE_TAG — Native mobile SDK preview" \
            --notes-file docs/RELEASE_NOTES.md
