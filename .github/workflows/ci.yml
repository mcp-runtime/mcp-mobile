name: SDK checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --jobs 4
      - run: swift run --jobs 4 MCPMobileCheck
      - name: Compile the iOS library
        run: >-
          swift build --target MCPMobile --jobs 4
          --triple arm64-apple-ios16.0-simulator
          --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          --scratch-path .build-ios
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-mobile-client
          path: target/release/*
