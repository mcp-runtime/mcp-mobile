name: SDK checks
on:
  push:
    branches: ['**']
    paths-ignore:
      # Docs-site-only files; docs/api/** (packaged by pom.xml) and
      # docs/RELEASE_NOTES.md (read by release.yml) still run the checks.
      - 'docs/.vitepress/**'
      - 'docs/public/**'
      - 'docs/index.md'
      - 'docs/overview.md'
      - 'docs/android.md'
      - 'docs/ios.md'
      - 'docs/api.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/PUBLISHING.md'
      - 'docs/VERIFICATION.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-api-page.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      # Docs-site-only files; docs/api/** (packaged by pom.xml) and
      # docs/RELEASE_NOTES.md (read by release.yml) still run the checks.
      - 'docs/.vitepress/**'
      - 'docs/public/**'
      - 'docs/index.md'
      - 'docs/overview.md'
      - 'docs/android.md'
      - 'docs/ios.md'
      - 'docs/api.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/PUBLISHING.md'
      - 'docs/VERIFICATION.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate-api-page.mjs'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --jobs 4
      - run: swift run --jobs 4 MCPMobileCheck
      - name: Compile the iOS library
        run: >-
          swift build --target MCPMobile --jobs 4
          --triple arm64-apple-ios16.0-simulator
          --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          --scratch-path .build-ios
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
      - run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-mobile-client
          path: target/release/*
